name: mediaserver

services:
  # ==========================================
  # MEDIA MANAGEMENT (CORE)
  # ==========================================
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Zurich
    volumes:
      - mediaserver_sonarr_config:/config
      - ${ROOT_MEDIA_PATH}:/data
      - ${OVERFLOW_MOVIES}:/data/Movies
      - ${OVERFLOW_SHOWS}:/data/Shows
    ports:
      - 8989:8989
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Zurich
    volumes:
      - radarr_config:/config
      - ${ROOT_MEDIA_PATH}:/data
      - ${OVERFLOW_MOVIES}:/data/Movies
      - ${OVERFLOW_SHOWS}:/data/Shows
    ports:
      - 7878:7878
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Zurich
    volumes:
      - bazarr_config:/config
      - ${ROOT_MEDIA_PATH}:/data
      - ${OVERFLOW_MOVIES}:/data/Movies
      - ${OVERFLOW_SHOWS}:/data/Shows
    ports:
      - 6767:6767
    restart: unless-stopped

  # ==========================================
  # INDEXERS & TOOLS
  # ==========================================
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Zurich
    volumes:
      - prowlarr_config:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Zurich
    ports:
      - 8191:8191
    restart: unless-stopped

  profilarr:
    image: santiagosayshey/profilarr:latest
    container_name: profilarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Zurich
    volumes:
      - profilarr_config:/config
    ports:
      - 6868:6868
    restart: unless-stopped

  # ==========================================
  # MEDIA SERVER & REQUESTS
  # ==========================================
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Zurich
    volumes:
      - jellyfin_config:/config
      - ${ROOT_MEDIA_PATH}:/data
      - ${OVERFLOW_MOVIES}:/data/Movies
      - ${OVERFLOW_SHOWS}:/data/Shows
    ports:
      - 8096:8096
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      - PUID=1000
      - PGID=1000
      - LOG_LEVEL=info
      - TZ=Europe/Zurich
    volumes:
      - jellyseerr_config:/app/config
    ports:
      - 5055:5055
    restart: unless-stopped

  # ==========================================
  # SYSTEM TOOLS
  # ==========================================
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 9999:8080
    restart: unless-stopped

# ==========================================
# VOLUMES DEFINITION
# ==========================================
volumes:
  mediaserver_sonarr_config:
    external: true
  radarr_config:
  bazarr_config:
  prowlarr_config:
  profilarr_config:
  jellyfin_config:
  jellyseerr_config:
